name: ToxiFiles CodeQL Diagnostic (local SARIF)

on:
  push:
    branches: [main, master, "feature/toxifiles-360-offline-office"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: toxifiles-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Android Java
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          chmod +x gradlew
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: +codeql/java-queries:AlertSuppression.ql
      - name: Build Android sources for analysis
        run: ./gradlew --no-daemon --stacktrace :app:compileDebugJavaWithJavac
      - name: Perform CodeQL analysis without conflicting with repository default setup
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
          upload: false

      - name: Stage SARIF inside the workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/codeql-sarif"
          shopt -s nullglob
          files=("$GITHUB_WORKSPACE/../results/"*.sarif)
          (( ${#files[@]} > 0 )) || { echo "::error::CodeQL produced no SARIF files"; exit 1; }
          cp "${files[@]}" "$GITHUB_WORKSPACE/codeql-sarif/"
      - name: Preserve SARIF for review
        uses: actions/upload-artifact@v4
        with:
          name: ToxiFiles-CodeQL-SARIF-review-only
          path: codeql-sarif/*.sarif
          if-no-files-found: error
          retention-days: 14

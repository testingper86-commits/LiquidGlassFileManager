name: ToxiFiles Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Test and assemble release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project if source is archived
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s gradlew ]]; then
            ARCHIVE=""
            while IFS= read -r candidate; do
              unzip -tq "$candidate" >/dev/null 2>&1 || continue
              if unzip -Z1 "$candidate" | grep -Eq '(^|/)gradlew$' && unzip -Z1 "$candidate" | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then ARCHIVE="$candidate"; break; fi
            done < <(find . -maxdepth 4 -type f -iname '*.zip' | sort)
            [[ -n "$ARCHIVE" ]] || { echo "::error::No valid ZIP containing a Gradle Android project was found."; exit 1; }
            TMP="$RUNNER_TEMP/toxifiles-release-project"
            mkdir -p "$TMP"
            unzip -oq "$ARCHIVE" -d "$TMP"
            ROOT=""
            while IFS= read -r candidate; do
              d="$(dirname "$candidate")"
              if [[ -s "$d/settings.gradle" || -s "$d/settings.gradle.kts" ]]; then ROOT="$d"; break; fi
            done < <(find "$TMP" -type f -name gradlew -print)
            [[ -n "$ROOT" ]] || { echo "::error::Archive contains no Gradle project root."; exit 1; }
            rsync -a "$ROOT"/ "$GITHUB_WORKSPACE"/
          fi
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s settings.gradle || test -s settings.gradle.kts
          chmod +x gradlew

      - name: Apply ordered ToxiFiles patch series
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .toxifiles-patches-applied ]]; then
            for p in patches/toxifiles-redesign.patch $(find patches -maxdepth 1 -type f \( -name 'toxifiles-redesign-part0[2-9].patch' -o -name 'toxifiles-redesign-part1[0-5].patch' \) | sort -V); do
              [[ -s "$p" ]] || { echo "::error::Missing patch $p"; exit 1; }
              patch --batch --forward -p1 < "$p"
            done
            touch .toxifiles-patches-applied
          fi
          for p in $(find patches -maxdepth 1 -type f -name 'toxifiles-redesign-part*.patch' | sort -V); do
            [[ -s "$p" ]] || { echo "::error::Missing patch $p"; exit 1; }
            part="$(basename "$p" .patch)"
            case "$part" in toxifiles-redesign-part0[2-9]|toxifiles-redesign-part1[0-5]) continue ;; esac
            marker=".toxifiles-$part-applied"
            [[ -f "$marker" ]] && continue
            if patch --dry-run --batch --forward -p1 < "$p" >/dev/null 2>&1; then
              patch --batch --forward -p1 < "$p"
            elif patch --dry-run --batch --reverse -p1 < "$p" >/dev/null 2>&1; then
              echo "$p already applied; recording marker."
            else
              echo "::error::Patch $p does not apply cleanly and is not already applied."
              exit 1
            fi
            touch "$marker"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source and XML
        shell: bash
        run: |
          set -euo pipefail
          python tools/project_smoke_test.py
          python tools/video_lifecycle_regression_test.py
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('app/src/main')
          files = [root / 'AndroidManifest.xml', *root.joinpath('res').rglob('*.xml')]
          for path in files:
              if path.is_file(): ET.parse(path)
          print(f'Validated XML in {len(files)} candidate files.')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo '::error::sdkmanager not found'; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configure optional release signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            KEYSTORE="$RUNNER_TEMP/toxifiles-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            test -s "$KEYSTORE"
            keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            {
              echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "artifact_name=ToxiFiles-release-signed" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "artifact_name=ToxiFiles-release-unsigned" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets are not configured; the artifact will be unsigned."
          fi

      - name: Run unit tests and Android lint
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug

      - name: Assemble release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Package release artifact and status
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" dist/ToxiFiles-release.apk
          if [[ "$SIGNED" == "true" ]]; then
            echo "Signed release APK; validate on target devices before distribution." > dist/BUILD-NOTES.txt
          else
            echo "Unsigned release APK. Use the debug APK artifact for device testing, or configure release signing secrets before distribution." > dist/BUILD-NOTES.txt
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

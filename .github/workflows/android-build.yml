name: ToxiFiles Android Build

on:
  push:
    branches: [main, master, "feature/toxifiles-final-liquid-glass-ui"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toxifiles-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and launch ToxiFiles
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project if source is archived
        shell: bash
        run: |
          set -euo pipefail
          # A checked-in native Android project is authoritative. The legacy patch series
          # is only for archive-based source bundles, not a tracked native project checkout.
          if [[ -s app/src/main/java/com/music/echo/offline/files/MainActivity.java && -s app/build.gradle.kts && ( -s settings.gradle || -s settings.gradle.kts ) ]]; then
            echo "Native Android source tree detected; skipping legacy archive patch overlay."
            exit 0
          fi
          if [[ ! -s gradlew ]]; then
            ARCHIVE=""
            while IFS= read -r candidate; do
              unzip -tq "$candidate" >/dev/null 2>&1 || continue
              if unzip -Z1 "$candidate" | grep -Eq '(^|/)gradlew$' && unzip -Z1 "$candidate" | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then ARCHIVE="$candidate"; break; fi
            done < <(find . -maxdepth 4 -type f -iname '*.zip' | sort)
            [[ -n "$ARCHIVE" ]] || { echo "::error::No valid ZIP containing a Gradle Android project was found."; exit 1; }
            TMP="$RUNNER_TEMP/toxifiles-project"
            mkdir -p "$TMP"
            unzip -oq "$ARCHIVE" -d "$TMP"
            ROOT=""
            while IFS= read -r candidate; do
              d="$(dirname "$candidate")"
              if [[ -s "$d/settings.gradle" || -s "$d/settings.gradle.kts" ]]; then ROOT="$d"; break; fi
            done < <(find "$TMP" -type f -name gradlew -print)
            [[ -n "$ROOT" ]] || { echo "::error::Archive contains no Gradle project root."; exit 1; }
            rsync -a "$ROOT"/ "$GITHUB_WORKSPACE"/
          fi
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s settings.gradle || test -s settings.gradle.kts
          chmod +x gradlew

      - name: Apply ordered ToxiFiles patch series safely
        shell: bash
        run: |
          set -euo pipefail
          # Native checked-in Android projects must not receive the legacy archive patch overlay.
          if [[ -s app/src/main/java/com/music/echo/offline/files/MainActivity.java && -s app/build.gradle.kts && ( -s settings.gradle || -s settings.gradle.kts ) ]]; then
            echo "Native Android source tree detected; skipping legacy patch series."
            exit 0
          fi
          # Patches are replayable: apply when they fit forward, skip when already present,
          # and fail with diagnostics only when neither state matches the checked-out tree.
          while IFS= read -r p; do
            [[ -s "$p" ]] || { echo "::error::Missing or empty patch $p"; exit 1; }
            part="$(basename "$p" .patch)"
            marker=".toxifiles-$part-applied"
            if [[ -f "$marker" ]]; then
              echo "$p already recorded as applied."
              continue
            fi
            if patch --dry-run --batch --forward -p1 < "$p" >/dev/null 2>&1; then
              patch --batch --forward -p1 < "$p"
              echo "Applied $p"
            elif patch --dry-run --batch --reverse -p1 < "$p" >/dev/null 2>&1; then
              echo "$p already applied; recording marker."
            else
              echo "::error::Patch $p is neither cleanly applicable nor already applied."
              patch --dry-run --batch --forward --verbose -p1 < "$p" || true
              exit 1
            fi
            touch "$marker"
          done < <(find patches -maxdepth 1 -type f -name 'toxifiles-redesign*.patch' | sort -V)
          rm -f app/src/main/assets/sound.json app/src/main/assets/wave.json
          if grep -RniE 'sound\.json|wave\.json|LottieAnimationView|com\.airbnb\.android:lottie' app/src/main app/build.gradle.kts; then
            echo "::error::Legacy visualizer references remain."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Structural smoke tests and Android XML validation
        shell: bash
        run: |
          set -euo pipefail
          python tools/project_smoke_test.py
          python tools/video_lifecycle_regression_test.py
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = [Path('app/src/main/AndroidManifest.xml'), *Path('app/src/main/res').rglob('*.xml')]
          for path in files:
              if path.is_file(): ET.parse(path)
          print('Android XML parsed successfully.')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          [[ -n "$SDKMANAGER" ]] || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToxiFiles-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release Android App Bundle
        run: ./gradlew --no-daemon --stacktrace bundleRelease

      - name: Upload release App Bundle (unsigned unless signing secrets are configured)
        uses: actions/upload-artifact@v4
        with:
          name: ToxiFiles-release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToxiFiles-lint-diagnostics
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Enable KVM access
        run: if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; else echo "::warning::/dev/kvm unavailable"; fi

      - name: Install and launch on Android 16 emulator
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          command -v adb
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          test -n "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          if [[ ! -x "$SDK_ROOT/emulator/emulator" ]]; then "$SDKMANAGER" --install emulator; fi
          if [[ ! -d "$SDK_ROOT/system-images/android-36/google_apis/x86_64" ]]; then "$SDKMANAGER" --install 'system-images;android-36;google_apis;x86_64'; fi
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export ANDROID_SDK_HOME="$HOME/.android"
          mkdir -p "$ANDROID_AVD_HOME"
          "$AVDMANAGER" create avd --name toxifiles-api36 --package 'system-images;android-36;google_apis;x86_64' --device pixel_2 --path "$ANDROID_AVD_HOME/toxifiles-api36.avd" --force <<< 'no'
          test -s "$ANDROID_AVD_HOME/toxifiles-api36.ini" || { "$AVDMANAGER" list avd; echo "::error::AVD definition was not created at $ANDROID_AVD_HOME"; exit 1; }
          "$AVDMANAGER" list avd
          mkdir -p dist
          "$SDK_ROOT/emulator/emulator" -avd toxifiles-api36 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim > "$RUNNER_TEMP/toxifiles-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'adb -s emulator-5554 emu kill >/dev/null 2>&1 || kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT
          adb start-server
          READY=0
          for attempt in $(seq 1 120); do
            STATE="$(adb -s emulator-5554 get-state 2>/dev/null || true)"
            if [ "$STATE" = "device" ]; then READY=1; break; fi
            sleep 2
          done
          test "$READY" -eq 1 || { cat "$RUNNER_TEMP/toxifiles-emulator.log"; exit 1; }
          BOOTED=0
          for attempt in $(seq 1 120); do
            BOOT="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | sed 's/[[:space:]]//g' || true)"
            if [ "$BOOT" = "1" ]; then BOOTED=1; break; fi
            sleep 2
          done
          test "$BOOTED" -eq 1 || { cat "$RUNNER_TEMP/toxifiles-emulator.log"; exit 1; }
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          adb -s emulator-5554 logcat -c
          adb -s emulator-5554 install -r "$APK"
          python tools/home_scroll_runtime_test.py
          adb -s emulator-5554 shell dumpsys activity activities > dist/emulator-activities.txt
          adb -s emulator-5554 logcat -d > dist/emulator-logcat.txt
          grep -E 'mResumedActivity|ResumedActivity' dist/emulator-activities.txt | grep -q 'com.liquidfiles.offline.debug'
          if grep -q 'FATAL EXCEPTION' dist/emulator-logcat.txt; then cat dist/emulator-logcat.txt; exit 1; fi

      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ToxiFiles-emulator-diagnostics
          path: |
            dist/emulator-activities.txt
            dist/emulator-logcat.txt
            ${{ runner.temp }}/toxifiles-emulator.log
          if-no-files-found: warn
          retention-days: 7

name: ToxiFiles Android Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toxifiles-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract valid Android project archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s gradlew ]]; then
            ARCHIVE=""
            while IFS= read -r candidate; do
              if ! unzip -tq "$candidate" >/dev/null 2>&1; then
                echo "::warning::Skipping invalid ZIP: $candidate"
                continue
              fi
              if unzip -Z1 "$candidate" | grep -Eq '(^|/)gradlew$' && unzip -Z1 "$candidate" | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
                ARCHIVE="$candidate"
                break
              fi
            done < <(find . -maxdepth 3 -type f -iname '*.zip' | sort)
            if [[ -z "$ARCHIVE" ]]; then
              echo "::error::No valid ZIP containing a Gradle Android project was found."
              exit 1
            fi
            EXTRACT_DIR="$RUNNER_TEMP/toxifiles-project"
            mkdir -p "$EXTRACT_DIR"
            unzip -oq "$ARCHIVE" -d "$EXTRACT_DIR"
            PROJECT_ROOT=""
            while IFS= read -r candidate; do
              d="$(dirname "$candidate")"
              if [[ -s "$candidate" && ( -s "$d/settings.gradle.kts" || -s "$d/settings.gradle" ) ]]; then PROJECT_ROOT="$d"; break; fi
            done < <(find "$EXTRACT_DIR" -type f -name gradlew -print)
            if [[ -z "$PROJECT_ROOT" ]]; then echo "::error::Archive is valid but has no Gradle project root."; exit 1; fi
            rsync -a --exclude='.github/' "$PROJECT_ROOT"/ "$GITHUB_WORKSPACE"/
          fi
          test -s gradlew
          test -s settings.gradle.kts || test -s settings.gradle
          test -s gradle/wrapper/gradle-wrapper.jar
          test -d app
          chmod +x gradlew
          echo "Android project root verified."

      - name: Apply ToxiFiles redesign patch series
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .toxifiles-patches-applied ]]; then
            for PATCH_FILE in patches/toxifiles-redesign.patch patches/toxifiles-redesign-part02.patch patches/toxifiles-redesign-part03.patch patches/toxifiles-redesign-part04.patch patches/toxifiles-redesign-part05.patch patches/toxifiles-redesign-part06.patch patches/toxifiles-redesign-part07.patch patches/toxifiles-redesign-part08.patch patches/toxifiles-redesign-part09.patch patches/toxifiles-redesign-part10.patch patches/toxifiles-redesign-part11.patch patches/toxifiles-redesign-part12.patch patches/toxifiles-redesign-part13.patch patches/toxifiles-redesign-part14.patch patches/toxifiles-redesign-part15.patch; do
              if [[ ! -s "$PATCH_FILE" ]]; then echo "::error::Required ToxiFiles patch missing: $PATCH_FILE"; exit 1; fi
              patch --batch --forward -p1 < "$PATCH_FILE"
            done
            touch .toxifiles-patches-applied
          fi
          for PATCH_FILE in patches/toxifiles-redesign-part*.patch; do
            [[ -e "$PATCH_FILE" ]] || continue
            case "$PATCH_FILE" in
              patches/toxifiles-redesign-part0[2-9].patch|patches/toxifiles-redesign-part1[0-5].patch) continue ;;
            esac
            MARKER=".toxifiles-$(basename "$PATCH_FILE" .patch)-applied"
            if [[ ! -f "$MARKER" ]]; then
              patch --batch --forward -p1 < "$PATCH_FILE"
              touch "$MARKER"
            fi
          done
          rm -f app/src/main/assets/sound.json app/src/main/assets/wave.json
          if grep -RniE 'sound\.json|wave\.json|LottieAnimationView|com\.airbnb\.android:lottie' app/src/main app/build.gradle.kts; then
            echo "::error::Legacy visualizer JSON/Lottie references remain in the packaged source."
            exit 1
          fi

      - name: Flatten and sync the Android source tree
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .toxifiles-source-tree ]]; then
            test -s gradlew
            test -s settings.gradle.kts || test -s settings.gradle
            touch .toxifiles-source-tree
            find . -maxdepth 1 -type f -iname '*.zip' -delete
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source tree is already synchronized."
          else
            git commit -m "Synchronize Android source tree"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Smoke tests and XML validation
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/project_smoke_test.py ]]; then python tools/project_smoke_test.py; fi
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('app/src/main')
          files = [root / 'AndroidManifest.xml', *root.joinpath('res').rglob('*.xml')]
          for path in files:
              if path.is_file(): ET.parse(path)
          print(f'Validated XML in {len(files)} candidate files.')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo '::error::sdkmanager not found'; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToxiFiles-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM device access for emulator
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo '::warning::/dev/kvm is unavailable; emulator may be unable to boot on this runner.'
          fi

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 10
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048
          heap-size: 512
          disable-animations: true
          script: |
            sh -c 'set -eu; mkdir -p dist; APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" -print -quit)"; test -n "$APK"; adb logcat -c; adb install -r "$APK"; adb shell monkey -p com.liquidfiles.offline.debug 1; sleep 12; adb shell dumpsys activity activities | grep -E "mResumedActivity|ResumedActivity" | grep -q "com.liquidfiles.offline.debug"; if adb logcat -d | grep -q "FATAL EXCEPTION"; then adb logcat -d > dist/emulator-failure-log.txt; exit 1; fi'


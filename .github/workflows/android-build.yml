name: ToxiFiles Android Build
on:
  push:
    branches: [main, master, "feature/toxifiles-final-liquid-glass-ui", "feature/toxifiles-360-offline-office", "ci/add-debug-apk-artifact"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toxifiles-android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ToxiFiles APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify native Android project
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            gradlew
            gradle/wrapper/gradle-wrapper.jar
            app/src/main/java/com/music/echo/offline/files/MainActivity.java
            app/src/main/java/com/music/echo/offline/files/ViewerActivity.java
            app/src/main/java/com/music/echo/offline/files/ToxiVisualSystem.java
            app/src/main/java/com/music/echo/offline/files/ToxiThemeSystem.java
            app/src/main/java/com/music/echo/offline/files/ToxiIcons.java
            app/src/main/java/com/music/echo/offline/files/ToxiFileRow.java
            app/src/main/java/com/music/echo/offline/files/ToxiMotion.java
            app/src/main/java/com/music/echo/offline/files/ToxiProgressSeekBar.java
            app/src/main/java/com/music/echo/offline/files/ToxiToolsActivity.java
            core/src/main/java/com/music/echo/offline/files/ToxiToolCore.java
            core/src/test/java/com/music/echo/offline/files/ToxiToolCoreTest.java
            app/src/main/java/com/music/echo/offline/files/DeveloperStudioActivity.java
            core/src/main/java/com/music/echo/offline/files/DeveloperStudioCore.java
            core/src/test/java/com/music/echo/offline/files/DeveloperStudioCoreTest.java
            tools/developer_studio_smoke_test.py
            app/src/test/java/com/music/echo/offline/files/ToxiThemeSystemTest.java
            app/src/main/res/drawable/ic_toxifiles_notification.xml
            app/src/main/res/drawable/toxifiles_splash.xml
            app/build.gradle.kts
            settings.gradle.kts
            core/build.gradle.kts
            core/src/main/java/com/music/echo/offline/files/OperationCancellation.java
            core/src/main/java/com/music/echo/offline/files/TaskScheduler.java
            core/src/main/java/com/music/echo/offline/files/StorageIndexEngine.java
            core/src/main/java/com/music/echo/offline/files/FileOperationEngine.java
            core/src/main/java/com/music/echo/offline/files/ArchiveOperations.java
            core/src/test/java/com/music/echo/offline/files/ArchiveOperationsTest.java
            core/src/test/java/com/music/echo/offline/files/FileOperationEngineTest.java
            core/src/test/java/com/music/echo/offline/files/StorageIndexEngineTest.java
            foundation/build.gradle.kts
            foundation/src/main/AndroidManifest.xml
            foundation/src/main/java/com/music/echo/offline/files/TaskCoordinator.java
            foundation/src/main/java/com/music/echo/offline/files/SafStorageOperations.java
            foundation/src/main/java/com/music/echo/offline/files/ToxiUriPermissions.java
            foundation/src/main/java/com/music/echo/offline/files/CrashLogger.java
            core/src/test/java/com/music/echo/offline/files/TaskSchedulerTest.java
            core/src/main/java/com/music/echo/offline/files/DuplicateFinder.java
            core/src/test/java/com/music/echo/offline/files/DuplicateFinderTest.java
            core/src/main/java/com/music/echo/offline/files/ArchivePath.java
            core/src/test/java/com/music/echo/offline/files/ArchivePathTest.java
            core/src/main/java/com/music/echo/offline/files/BatchRenameEngine.java
            core/src/main/java/com/music/echo/offline/files/PinHash.java
            core/src/test/java/com/music/echo/offline/files/BatchRenameEngineTest.java
            core/src/test/java/com/music/echo/offline/files/PinHashTest.java
            core/src/main/java/com/music/echo/offline/files/SafePathResolver.java
            core/src/test/java/com/music/echo/offline/files/SafePathResolverTest.java
            app/src/main/java/com/music/echo/offline/files/SettingsScreenController.java
            app/src/main/java/com/music/echo/offline/files/SettingsBackupManager.java
            app/src/main/java/com/music/echo/offline/files/ToxiBackNavigation.java
            app/src/main/res/drawable-nodpi/theme_poster_onepiece.webp
            app/src/main/res/drawable-nodpi/theme_poster_naruto.webp
            app/src/main/res/drawable-nodpi/theme_poster_demon.webp
            app/src/main/res/drawable-nodpi/theme_poster_dragonball.webp
            app/src/main/res/drawable-nodpi/theme_poster_aot.webp
          )
          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Required project file is missing or empty"
              exit 1
            fi
          done
          chmod +x gradlew
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          [[ -n "$SDKMANAGER" ]] || { echo "::error::sdkmanager not found"; exit 1; }
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify complete visual replacement
        run: python3 tools/toxifiles_visual_replacement_test.py
      - name: Verify restricted offline Developer Studio
        run: python3 tools/developer_studio_smoke_test.py
      - name: Verify current project and security contracts
        run: python3 tools/project_smoke_test.py
      - name: Verify media lifecycle regressions
        run: python3 tools/video_lifecycle_regression_test.py
      - name: Test dependency license metadata parser
        run: python3 tools/dependency_audit_test.py
      - name: Inventory resolved runtime dependencies
        run: python3 tools/dependency_audit.py
      - name: Run Android unit tests and lint
        run: ./gradlew --no-daemon :core:test :foundation:testDebugUnitTest :foundation:lintDebug :app:testDebugUnitTest :app:lintDebug
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ToxiFiles-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build optimized universal release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Enforce 5 MiB universal APK budget
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          (("${#apks[@]}" == 1)) || { echo "::error::Expected one universal release APK; found ${#apks[@]}"; exit 1; }
          for apk in "${apks[@]}"; do
            size=$(stat -c '%s' "$apk")
            echo "$(basename "$apk"): $((size / 1024)) KiB"
            ((size <= 5 * 1024 * 1024)) || { echo "::error::$(basename "$apk") exceeds the 5 MiB APK budget"; exit 1; }
          done
      - name: Upload optimized universal release APK
        uses: actions/upload-artifact@v7
        with:
          name: ToxiFiles-release-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload dependency inventory
        uses: actions/upload-artifact@v7
        with:
          name: ToxiFiles-dependency-inventory
          path: build/reports/toxifiles-dependency-audit.md
          if-no-files-found: error
          retention-days: 30

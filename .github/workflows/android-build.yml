name: ToxiFiles Android Build
on:
  push:
    branches: [main, master, "feature/toxifiles-final-liquid-glass-ui", "feature/toxifiles-360-offline-office"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toxifiles-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build ToxiFiles APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify native Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s app/src/main/java/com/music/echo/offline/files/MainActivity.java
          test -s app/src/main/java/com/music/echo/offline/files/ViewerActivity.java
          test -s app/src/main/java/com/music/echo/offline/files/ToxiVisualSystem.java
          test -s app/src/main/java/com/music/echo/offline/files/ToxiThemeSystem.java
          test -s app/src/main/java/com/music/echo/offline/files/ToxiIcons.java
          test -s app/src/main/java/com/music/echo/offline/files/ToxiFileRow.java
          test -s app/src/main/java/com/music/echo/offline/files/ToxiMotion.java
          test -s app/src/main/java/com/music/echo/offline/files/ToxiProgressSeekBar.java
          test -s app/src/main/java/com/music/echo/offline/files/ToxiToolsActivity.java
          test -s core/src/main/java/com/music/echo/offline/files/ToxiToolCore.java
          test -s core/src/test/java/com/music/echo/offline/files/ToxiToolCoreTest.java
          test -s app/src/main/java/com/music/echo/offline/files/DeveloperStudioActivity.java
          test -s core/src/main/java/com/music/echo/offline/files/DeveloperStudioCore.java
          test -s core/src/test/java/com/music/echo/offline/files/DeveloperStudioCoreTest.java
          test -s tools/developer_studio_smoke_test.py
          test -s app/src/test/java/com/music/echo/offline/files/ToxiThemeSystemTest.java
          test -s app/src/main/res/drawable/ic_toxifiles_brand_mark.xml
          test -s app/src/main/res/drawable/ic_toxifiles_app_icon.xml
          test -s app/src/main/res/drawable/ic_toxifiles_notification.xml
          test -s app/src/main/res/drawable/toxifiles_splash.xml
          test -s app/build.gradle.kts
          test -s settings.gradle || test -s settings.gradle.kts
          test -s core/build.gradle.kts
          test -s core/src/main/java/com/music/echo/offline/files/OperationCancellation.java
          test -s core/src/main/java/com/music/echo/offline/files/TaskScheduler.java
          test -s core/src/main/java/com/music/echo/offline/files/StorageIndexEngine.java
          test -s core/src/main/java/com/music/echo/offline/files/FileOperationEngine.java
          test -s core/src/test/java/com/music/echo/offline/files/FileOperationEngineTest.java
          test -s core/src/test/java/com/music/echo/offline/files/StorageIndexEngineTest.java
          test -s foundation/build.gradle.kts
          test -s foundation/src/main/AndroidManifest.xml
          test -s foundation/src/main/java/com/music/echo/offline/files/TaskCoordinator.java
          test -s foundation/src/main/java/com/music/echo/offline/files/SafStorageOperations.java
          test -s foundation/src/main/java/com/music/echo/offline/files/ToxiUriPermissions.java
          test -s foundation/src/main/java/com/music/echo/offline/files/CrashLogger.java
          test -s core/src/test/java/com/music/echo/offline/files/TaskSchedulerTest.java
          test -s core/src/main/java/com/music/echo/offline/files/DuplicateFinder.java
          test -s core/src/test/java/com/music/echo/offline/files/DuplicateFinderTest.java
          test -s core/src/main/java/com/music/echo/offline/files/ArchivePath.java
          test -s core/src/test/java/com/music/echo/offline/files/ArchivePathTest.java
          test -s core/src/main/java/com/music/echo/offline/files/BatchRenameEngine.java
          test -s core/src/main/java/com/music/echo/offline/files/PinHash.java
          test -s core/src/test/java/com/music/echo/offline/files/BatchRenameEngineTest.java
          test -s core/src/test/java/com/music/echo/offline/files/PinHashTest.java
          test -s core/src/main/java/com/music/echo/offline/files/SafePathResolver.java
          test -s core/src/test/java/com/music/echo/offline/files/SafePathResolverTest.java
          chmod +x gradlew
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          [[ -n "$SDKMANAGER" ]] || { echo "::error::sdkmanager not found"; exit 1; }
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify complete visual replacement
        run: python3 tools/toxifiles_visual_replacement_test.py
      - name: Verify restricted offline Developer Studio
        run: python3 tools/developer_studio_smoke_test.py
      - name: Verify current project and security contracts
        run: python3 tools/project_smoke_test.py
      - name: Verify media lifecycle regressions
        run: python3 tools/video_lifecycle_regression_test.py
      - name: Test dependency license metadata parser
        run: python3 tools/dependency_audit_test.py
      - name: Inventory resolved runtime dependencies
        run: python3 tools/dependency_audit.py
      - name: Run Android unit tests and lint
        run: ./gradlew --no-daemon :core:test :foundation:testDebugUnitTest :foundation:lintDebug :app:testDebugUnitTest :app:lintDebug
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToxiFiles-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: ToxiFiles-dependency-inventory
          path: build/reports/toxifiles-dependency-audit.md
          if-no-files-found: error
          retention-days: 30

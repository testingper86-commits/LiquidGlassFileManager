name: LiquidFiles Offline Manager - Android Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liquidfiles-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP if source is not at repository root
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s gradlew ]]; then
            ARCHIVE="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"
            if [[ -z "$ARCHIVE" ]]; then
              echo "::error::gradlew is missing and no project ZIP was found. Upload the project files or a ZIP containing gradlew, settings.gradle(.kts), gradle/wrapper, and app/."
              exit 1
            fi

            EXTRACT_DIR="$RUNNER_TEMP/liquidfiles-project"
            mkdir -p "$EXTRACT_DIR"
            unzip -oq "$ARCHIVE" -d "$EXTRACT_DIR"

            PROJECT_ROOT=""
            while IFS= read -r candidate; do
              candidate_dir="$(dirname "$candidate")"
              if [[ -s "$candidate" && ( -s "$candidate_dir/settings.gradle.kts" || -s "$candidate_dir/settings.gradle" ) ]]; then
                PROJECT_ROOT="$candidate_dir"
                break
              fi
            done < <(find "$EXTRACT_DIR" -type f -name gradlew -print)

            if [[ -z "$PROJECT_ROOT" ]]; then
              echo "::error::ZIP was extracted, but no Gradle project root containing gradlew and settings.gradle(.kts) was found."
              find "$EXTRACT_DIR" -maxdepth 4 -type f | head -80
              exit 1
            fi

            cp -a "$PROJECT_ROOT"/. "$GITHUB_WORKSPACE"/
          fi

          test -s gradlew
          test -s settings.gradle.kts || test -s settings.gradle
          test -s gradle/wrapper/gradle-wrapper.jar
          test -d app
          chmod +x gradlew
          echo "Android project root verified."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Smoke tests and XML validation
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/project_smoke_test.py ]]; then python tools/project_smoke_test.py; fi
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('app/src/main')
          files = [root / 'AndroidManifest.xml', *(root / 'res').rglob('*.xml')]
          for p in files:
              if p.is_file():
                  ET.parse(p)
                  print('XML OK:', p)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFiles-Offline-Manager-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

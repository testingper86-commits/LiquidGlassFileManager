name: ToxiFiles Android Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toxifiles-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract valid Android project archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s gradlew ]]; then
            ARCHIVE=""
            while IFS= read -r candidate; do
              if ! unzip -tq "$candidate" >/dev/null 2>&1; then
                echo "::warning::Skipping invalid ZIP: $candidate"
                continue
              fi
              if unzip -Z1 "$candidate" | grep -Eq '(^|/)gradlew$' && unzip -Z1 "$candidate" | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
                ARCHIVE="$candidate"
                break
              fi
            done < <(find . -maxdepth 3 -type f -iname '*.zip' | sort)
            if [[ -z "$ARCHIVE" ]]; then
              echo "::error::No valid ZIP containing a Gradle Android project was found."
              exit 1
            fi
            EXTRACT_DIR="$RUNNER_TEMP/toxifiles-project"
            mkdir -p "$EXTRACT_DIR"
            unzip -oq "$ARCHIVE" -d "$EXTRACT_DIR"
            PROJECT_ROOT=""
            while IFS= read -r candidate; do
              d="$(dirname "$candidate")"
              if [[ -s "$candidate" && ( -s "$d/settings.gradle.kts" || -s "$d/settings.gradle" ) ]]; then PROJECT_ROOT="$d"; break; fi
            done < <(find "$EXTRACT_DIR" -type f -name gradlew -print)
            if [[ -z "$PROJECT_ROOT" ]]; then echo "::error::Archive is valid but has no Gradle project root."; exit 1; fi
            cp -a "$PROJECT_ROOT"/. "$GITHUB_WORKSPACE"/
          fi
          test -s gradlew
          test -s settings.gradle.kts || test -s settings.gradle
          test -s gradle/wrapper/gradle-wrapper.jar
          test -d app
          chmod +x gradlew
          echo "Android project root verified."

      - name: Apply ToxiFiles redesign patch series
        shell: bash
        run: |
          set -euo pipefail
          for PATCH_FILE in patches/toxifiles-redesign.patch patches/toxifiles-redesign-part02.patch patches/toxifiles-redesign-part03.patch patches/toxifiles-redesign-part04.patch patches/toxifiles-redesign-part05.patch patches/toxifiles-redesign-part06.patch patches/toxifiles-redesign-part07.patch patches/toxifiles-redesign-part08.patch patches/toxifiles-redesign-part09.patch patches/toxifiles-redesign-part10.patch; do
            if [[ ! -s "$PATCH_FILE" ]]; then
              echo "::error::Required ToxiFiles patch missing: $PATCH_FILE"
              exit 1
            fi
            patch --batch --forward -p1 < "$PATCH_FILE"
          done
          # Some legacy source archives still contain these assets even when the patch baseline does not.
          rm -f app/src/main/assets/sound.json app/src/main/assets/wave.json
          if grep -RniE 'sound\\.json|wave\\.json|LottieAnimationView|com\\.airbnb\\.android:lottie' app/src/main app/build.gradle.kts; then
            echo "::error::Legacy visualizer JSON/Lottie references remain in the packaged source."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Smoke tests and XML validation
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/project_smoke_test.py ]]; then python tools/project_smoke_test.py; fi
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('app/src/main')
          files = [root / 'AndroidManifest.xml', *root.joinpath('res').rglob('*.xml')]
          for path in files:
              if path.is_file(): ET.parse(path)
          print(f'Validated XML in {len(files)} candidate files.')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo '::error::sdkmanager not found'; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToxiFiles-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 10
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK="$(find dist -maxdepth 1 -type f -name '*.apk' -print -quit)"
            test -n "$APK"
            adb logcat -c
            adb install -r "$APK"
            adb shell monkey -p com.liquidfiles.offline 1
            sleep 12
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|ResumedActivity' | grep -q 'com.liquidfiles.offline'
            if adb logcat -d | grep -q 'FATAL EXCEPTION'; then
              adb logcat -d > dist/emulator-failure-log.txt
              exit 1
            fi


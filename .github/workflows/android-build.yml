name: ToxiFiles Android Build

on:
  push:
    branches: [main, master, "feature/toxifiles-final-liquid-glass-ui", "feature/toxifiles-360-offline-office"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toxifiles-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ToxiFiles APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify native Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s app/src/main/java/com/music/echo/offline/files/MainActivity.java
          test -s app/src/main/java/com/music/echo/offline/files/ViewerActivity.java
          test -s app/src/main/java/com/music/echo/offline/files/ToxiVisualSystem.java
          test -s app/src/main/java/com/music/echo/offline/files/ToxiThemeSystem.java
          test -s app/src/main/java/com/music/echo/offline/files/ToxiIcons.java
          test -s app/src/main/java/com/music/echo/offline/files/ToxiFileRow.java
          test -s app/src/main/java/com/music/echo/offline/files/ToxiMotion.java
          test -s app/src/main/java/com/music/echo/offline/files/ToxiProgressSeekBar.java
          test -s app/src/test/java/com/music/echo/offline/files/ToxiThemeSystemTest.java
          test -s app/src/main/res/drawable/ic_toxifiles_brand_mark.xml
          test -s app/src/main/res/drawable/ic_toxifiles_app_icon.xml
          test -s app/src/main/res/drawable/ic_toxifiles_notification.xml
          test -s app/src/main/res/drawable/toxifiles_splash.xml
          test -s app/build.gradle.kts
          test -s settings.gradle || test -s settings.gradle.kts
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          [[ -n "$SDKMANAGER" ]] || { echo "::error::sdkmanager not found"; exit 1; }
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Verify complete visual replacement
        run: python3 tools/toxifiles_visual_replacement_test.py

      - name: Run Android unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ToxiFiles-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

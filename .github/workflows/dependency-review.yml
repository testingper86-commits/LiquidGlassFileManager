name: ToxiFiles Dependency Review

on:
  pull_request:
    branches: [main, master, "feature/toxifiles-360-offline-office"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: toxifiles-dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

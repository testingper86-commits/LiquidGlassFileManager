name: ToxiFiles Signed Debug APK
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "foundation/**"
      - "gradle/**"
      - "*.gradle"
      - "*.gradle.kts"
      - "gradlew"
      - ".github/workflows/toxifiles-debug-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toxifiles-debug-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  debug-apk:
    name: Build and verify installable debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          [[ -n "$SDKMANAGER" ]] || { echo "::error::sdkmanager not found"; exit 1; }
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify debug APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK" || { echo "::error::Debug APK was not produced"; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          AAPT="$SDK_ROOT/build-tools/36.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep -q "^package:"
          sha256sum "$APK"
          stat -c 'Debug APK size: %s bytes' "$APK"
      - name: Upload signed debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ToxiFiles-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: ToxiFiles Agent Orchestrator Tests

on:
  push:
    paths:
      - 'orchestrator/**'
      - '.github/workflows/agent-orchestrator*.yml'
  pull_request:
    paths:
      - 'orchestrator/**'
      - '.github/workflows/agent-orchestrator*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate orchestrator configuration
        run: python -m json.tool orchestrator/config.json > /dev/null
      - name: Run offline unit tests
        working-directory: orchestrator
        run: python -m unittest discover -v -p 'test_*.py'


name: Build LiquidGlassFileManager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LiquidGlassFileManager_v17.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded project
        run: |
          test -f LiquidGlassFileManager_v17.zip
          mkdir extracted
          unzip -q LiquidGlassFileManager_v17.zip -d extracted

      - name: Find Gradle project
        shell: bash
        run: |
          WRAPPER=$(find extracted -type f -name gradlew -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassFileManager-debug-apk
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          

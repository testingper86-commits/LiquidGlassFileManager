name: Android Build & Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source and manifest smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run project smoke tests
        run: python tools/project_smoke_test.py

  android-build:
    name: Compile Android debug APK
    runs-on: ubuntu-latest
    needs: source-checks
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Validate Gradle wrapper
        run: |
          test -s gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
      - name: Compile debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidFiles-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

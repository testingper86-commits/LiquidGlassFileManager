name: Build LiquidGlassFileManager Complete Upgrade

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'LiquidGlassFileManager_Deep_Upgrade_Pass3_Fixed2.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Verify and Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract the fixed project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP='LiquidGlassFileManager_Deep_Upgrade_Pass3_Fixed2.zip'

          if [ ! -f "$ZIP" ]; then
            echo "::error::Required project ZIP not found: $ZIP"
            ls -la
            exit 1
          fi

          unzip -t "$ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          SETTINGS="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo '::error::settings.gradle(.kts) not found in ZIP'
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::App module Gradle build file missing under $PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building project from: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Show build environment
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          java -version
          gradle --version
          echo "Project directory: $PWD"
          ls -la

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Verify generated APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK_DIR='app/build/outputs/apk/debug'
          if ! find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .; then
            echo "::error::No debug APK was generated in $APK_DIR"
            exit 1
          fi
          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassFileManager-Fixed-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

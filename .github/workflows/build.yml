name: Build LiquidGlassFileManager Complete Upgrade

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'LiquidGlassFileManager_Deep_Upgrade_Pass3.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Verify and Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract the uploaded Pass 3 project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="LiquidGlassFileManager_Deep_Upgrade_Pass3.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Required project ZIP not found: $ZIP"
            echo "Files available in repository root:"
            ls -la
            exit 1
          fi

          echo "Checking ZIP archive integrity..."
          unzip -t "$ZIP"

          echo "Extracting Android project..."
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          echo "Locating Gradle project..."
          SETTINGS="$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle or settings.gradle.kts not found in ZIP"
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::App module Gradle build file not found in $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project located at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle-8.9-bin.zip"

          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Show build environment
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          java -version
          gradle --version
          echo "Project directory: $PWD"
          ls -la

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Verify generated APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Debug APK output directory was not created"
            exit 1
          fi

          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print

          if ! find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' \
            -print -quit | grep -q .; then
            echo "::error::No debug APK was generated"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassFileManager-Deep-Upgrade-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

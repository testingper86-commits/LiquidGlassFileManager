
name: Build LiquidGlassFileManager APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found in repository."
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Find Gradle project
        run: |
          WRAPPER=$(find extracted -type f -name gradlew -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "gradlew not found inside ZIP."
            find extracted -maxdepth 4 -type f | head -80
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"
          chmod +x "$WRAPPER"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassFileManager-debug-apk
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

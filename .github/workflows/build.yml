name: Build LiquidGlassFileManager Complete Upgrade

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'LiquidGlassFileManager_Complete_Upgrade_2026-10-18.zip'
      - '.github/workflows/build.yml'
      - 'build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract the complete-upgrade project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP='LiquidGlassFileManager_Complete_Upgrade_2026-10-18.zip'
          test -f "$ZIP" || { echo "ERROR: Required project ZIP not found: $ZIP"; exit 1; }
          unzip -t "$ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$SETTINGS" || { echo 'ERROR: settings.gradle(.kts) not found in the ZIP'; exit 1; }
          PROJECT_DIR=$(dirname "$SETTINGS")
          test -f "$PROJECT_DIR/app/build.gradle.kts" -o -f "$PROJECT_DIR/app/build.gradle" || { echo "ERROR: app module build file missing under $PROJECT_DIR"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building project from: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          echo '/tmp/gradle-8.9/bin' >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassFileManager-Complete-Upgrade-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
